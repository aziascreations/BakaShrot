# The BakaShrot workspace: every crate is in crates/, see readme.md for the
# layout and revamp.md for the plan.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "CC0-1.0"
authors = ["Herwin Bozet (NibblePoker)"]
repository = "https://github.com/aziascreations/BakaShrot"
publish = false

# Every crate takes these with `[lints] workspace = true`. `unsafe_code` is
# "deny", not "forbid", so the C API crate can allow it at its root.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Optimized for size: 25-31% smaller programs and DLL (the server 6.6 MB
# to 4.7 MB), about 5% fewer pushes with `normal` (none with `full`, the
# disk's), the same handshakes and attachments. Measured 2026-11-14;
# "z" is barely smaller, the C (aws-lc, SQLite) kept at 3 adds 1.2 MB for
# nothing measurable.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# Kept on purpose: the C DLL catches panics at every export (catch_unwind),
# which "abort" would make impossible.
panic = "unwind"
