; BakaShrot config file.
; Section names are literal strings as far as PureBasic's Preferences
; library is concerned — the dots below are just part of the name.

[BakaShrot]
; Config shared by every type of config.

; This node's Ed25519 private key (Base64), used to sign every packet it
; sends. Its matching public key must be handed to peers, who store it as
; PublicKey below in THEIR own config. See Networking/Cryptography.pbi.
PrivateKey =

; Replication Group ID to which this node belongs.
GroupId =

; Node ID that uniquely represents this node within its replication group.
NodeId =


[BakaShrot.Server]
; IPV4 that the server will be bound to.
Host =

; Used port.
Port =

; List of groups from which the server will attempt to replicate.
; Format: 0;1;100-150;200;...
ReplicatingGroupIds =

; Amount of threads used for networking-related tasks
NetThreadPoolSize = 4


[BakaShrot.Client]
; No fields yet.


; One [BakaShrot.Peer.<name>] section per peer this node talks to.
; <name> is only a key for this file; it is never sent on the wire.
[BakaShrot.Peer.example]
; Remote address of the peer. Can be a domain name, IPV4 or IPV6.
Host =

; Remote port of the peer (0-65535).
Port =

; Remote node's GID. The connection is aborted if it differs.
GroupId =

; Remote node's node id. The connection is aborted if it differs.
NodeId =

; This peer's Ed25519 public key (Base64), used to verify the signature on
; every packet it sends. See Networking/Cryptography.pbi.
PublicKey =
