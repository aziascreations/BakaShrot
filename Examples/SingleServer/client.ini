; ============================================================================
; BakaShrot example: the client's config, read by every tool (their last
; argument), the client DLL and the Python client.
;
; EXAMPLE KEYS, PUBLIC IN THE REPOSITORY: never use them for anything real.
; Make your own with BakaShrotGenerateKeyPairs.exe.
; ============================================================================

[BakaShrot]
; This client's key pair. The server lists the public key in
; [BakaShrot.Client.demo] PublicKeys.
PrivateKey = zDA8o6hp7zkIatlumOKFWqV8j3yYON8QFpIkMAEnpJnKv4FbbX4SmshWDRJp9ds5qpEDVYRHSnE7exw2pkQK1w==
PublicKey = yr+BW21+EprIVg0SafXbOaqRA1WER0pxO3scNqZECtc=

; The node it writes as: the server checks its section for this key says
; Node = demo. Every message it pushes is stored as "demo".
; No topic here: where its pushes go when they don't name one is the
; server's DefaultTopic, which topics it may push to and read its
; PushTopics and ReadTopics.
Node = demo

; Where the server is, and its public key: the client only talks to the
; server holding the matching private key.
ServerHost = 127.0.0.1
ServerPort = 12360
ServerPublicKey = k32QNiTXL9lA7DhdwBQv9jQXouADujciaOWVZuA3JE4=
