[package]
name = "bakashrot-pki"
description = "BakaShrot's certificates: issuing them and CRLs, reading identities, the TLS setup of servers and clients."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bakashrot-proto = { path = "../bakashrot-proto" }
# Issuing certificates and CRLs, P-384 keys through aws-lc.
rcgen = { version = "0.14.10", default-features = false, features = ["x509-parser", "pem", "aws_lc_rs"] }
# TLS 1.3 only, through aws-lc (the one with ML-KEM).
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
time = "0.3.55"
# Reading certificates and CRLs, a CRL's signature checked through aws-lc.
x509-parser = { version = "0.18.1", features = ["verify-aws"] }
# The identity extension's DER (rcgen's own DER library).
yasna = "0.6.0"

[lints]
workspace = true
