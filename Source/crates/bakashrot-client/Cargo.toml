[package]
name = "bakashrot-client"
description = "BakaShrot's client library: blocking, TLS with the CA's certificates, the requests of protocol 7."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The attachments' SHA-256: the TLS one's (aws-lc), no other crate.
aws-lc-rs = "1.19.0"
bakashrot-proto = { path = "../bakashrot-proto" }
bakashrot-pki = { path = "../bakashrot-pki" }
# The same as bakashrot-pki's: TLS 1.3 through aws-lc.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }

[lints]
workspace = true
