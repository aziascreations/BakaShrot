; ============================================================================
; BakaShrot server config, for docker-compose.yml: empty, fill it in.
;
; Every option is documented in Server/Config/schema.ini (config.example.ini
; in a release). Keys: BakaShrotGenerateKeyPairs.exe. Never commit a filled
; in copy, it holds the server's private key.
; ============================================================================

[BakaShrot]
; This server's private key. Its public key, which clients need as
; ServerPublicKey, is in the log when it starts (docker compose logs).
PrivateKey =

; The node this server authenticates as when it links to peers.
Node =


[BakaShrot.Topics]
; One topic name per line.
; logs


[BakaShrot.Retention]
; topic = age (30d, 12h...), or nothing to keep everything forever.
; logs = 30d


[BakaShrot.Server]
; Empty: every interface (127.0.0.1 can't be reached from outside the
; container). The port must match docker-compose.yml's.
Host =
Port = 12345
ReplicatingTopics =
NetThreadPoolSize = 4
; In the bakashrot-data volume.
DatabasePath = /var/lib/bakashrot/server.sqlite
MaxAttachmentSize = 1G
Synchronous = FULL


; One section per peer, see schema.ini.
; [BakaShrot.Peer.other]
; Host =
; Port =
; Node =
; PublicKey =


; One section per client allowed to connect.
[BakaShrot.Client.example]
; The client's public key (client.ini's PublicKey).
PublicKeys =
; The node it writes as (client.ini's Node must say the same).
Node =
; DefaultTopic = logs
; PushTopics = logs
; ReadTopics = *
AllowRead = 1
AllowWrite = 1
AllowQuery = 0
