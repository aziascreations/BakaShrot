[package]
name = "bakashrot-config"
description = "BakaShrot's server config: topics, retention, replication, roles and what they may do."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The name rules, the limits.
bakashrot-proto = { path = "../bakashrot-proto" }
# Sections kept in the file's order ([retention]'s first matching pattern
# wins): toml's `preserve_order` reads them in order, IndexMap keeps it.
indexmap = { version = "2.14.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# Reading only (`display`: values quoted back in errors).
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde", "display", "preserve_order"] }

[lints]
workspace = true
