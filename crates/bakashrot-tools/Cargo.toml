[package]
name = "bakashrot-tools"
description = "BakaShrot's command-line tools: bakashrot pushes and reads messages, bakashrot-cert issues certificates and revokes them."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# No API to document, and its name is the DLL's library's (cargo doc would
# collide).
[[bin]]
name = "bakashrot"
doc = false

[dependencies]
bakashrot-client = { path = "../bakashrot-client" }
bakashrot-pki = { path = "../bakashrot-pki" }
bakashrot-proto = { path = "../bakashrot-proto" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
time = "0.3.55"
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
bakashrot-config = { path = "../bakashrot-config" }
bakashrot-server = { path = "../bakashrot-server" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

[lints]
workspace = true
