[package]
name = "bakashrot-capi"
description = "BakaShrot's C DLL: the BakaShrot_* exports over bakashrot-client, one connection per process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

# bakashrot.dll / libbakashrot.so; the rlib for the tests.
[lib]
name = "bakashrot"
crate-type = ["cdylib", "rlib"]

[dependencies]
bakashrot-client = { path = "../bakashrot-client" }
bakashrot-proto = { path = "../bakashrot-proto" }
serde_json = "1.0.154"

[dev-dependencies]
bakashrot-config = { path = "../bakashrot-config" }
bakashrot-pki = { path = "../bakashrot-pki" }
bakashrot-server = { path = "../bakashrot-server" }
cbindgen = { version = "0.29.4", default-features = false }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net"] }

[lints]
workspace = true
