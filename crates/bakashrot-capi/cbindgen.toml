# bindings/c/bakashrot.h, generated from src/lib.rs by tests/header.rs
# (which rewrites it when the exports change: check it in then).
language = "C"
header = """/*
 * BakaShrot's client DLL: bakashrot.dll (Windows), libbakashrot.so (Linux).
 * Generated by cbindgen from crates/bakashrot-capi: don't edit.
 * docs/client.md has the conventions and the whole API.
 */"""
include_guard = "BAKASHROT_H"
cpp_compat = true
documentation = true
line_endings = "LF"
usize_is_size_t = true
